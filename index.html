<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    HOME PAGE
    Search, topic chips, and the dated list of published entries.
    Content comes from entries/index.json — do not edit this file to add a post.
    To add a post: open studio/index.html (owner only).
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Journal of David Ziklag Foster — notes, stills, and work in progress." />
  <meta name="theme-color" content="#0c0b0e" />
  <title>Journal · David Ziklag Foster</title>
  <link rel="stylesheet" href="css/style.css?v=20260921b" />
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Tree mark top-left, same placement as the portfolio. -->
  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="assets/mark.jpg" alt="DZF tree mark"
           onerror="this.onerror=null;this.src='https://darkstone007.github.io/Portfolio/Media/Lo.jpg'" />
      <span class="brand-text">
        <span class="brand-name">Journal</span>
        <span class="brand-author">David Ziklag Foster</span>
      </span>
    </a>
    <nav class="nav">
      <a href="index.html" aria-current="page">Entries</a>
      <a href="log.html">Log</a>
      <a href="https://darkstone007.github.io/Portfolio/" target="_blank" rel="noreferrer">Portfolio</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="intro">
      <p class="eyebrow">Personal journal</p>
      <h1>Notes, stills, and work in progress.</h1>
      <p class="lede">
        Anyone may read. Only I write.
        Signed with the tree mark, same as the
        <a href="https://darkstone007.github.io/Portfolio/" target="_blank" rel="noreferrer">portfolio</a>.
      </p>
    </section>

    <!-- Search titles, topics, and body. Topic chips filter the list. -->
    <section class="toolbar">
      <label class="field" style="margin:0">
        <span class="eyebrow" style="display:block;margin-bottom:8px">Search</span>
        <input id="search" class="search" type="search" placeholder="Search titles, topics, words…" autocomplete="off" />
      </label>
      <div id="topics" class="topics"></div>
    </section>

    <section>
      <h2 class="list-heading" id="list-heading">Entries</h2>
      <div id="post-list">
        <p class="quiet">Loading entries…</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <img class="brand-mark small" src="assets/mark.jpg" alt=""
         onerror="this.onerror=null;this.src='https://darkstone007.github.io/Portfolio/Media/Lo.jpg'" />
    <p>DZF · matte black / royal purple</p>
  </footer>

  <script src="js/core.js?v=20260921b"></script>
  <script src="js/app.js?v=20260921b"></script>
</body>
</html>

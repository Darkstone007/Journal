# Publishes this folder to GitHub Pages on every push to main.
# Live URL: https://darkstone007.github.io/Journal/
#
# First time: repo Settings → Pages → Source: GitHub Actions
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tree mark
        run: |
          mkdir -p assets
          if [ -f assets/mark.b64 ]; then
            base64 -d assets/mark.b64 > assets/mark.jpg || true
          fi
          curl -fsSL -o assets/logo.jpg https://raw.githubusercontent.com/Darkstone007/Portfolio/main/Media/Lo.jpg || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
